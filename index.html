    <script>
   // ============================================================
// PERSISTENT YOUTUBE PLAYLIST BGM - Smooth Across Pages
// ============================================================
let youtubePlayer = null;
let bgmEnabled = true;
let shuffleEnabled = false;
let isPlayerReady = false;
let isSeekingComplete = false;
let pendingSeekTime = 0;

const PLAYLIST_ID = 'PLUmFF7Wbo1Gw';
const BGM_VOLUME = 8;

// ============================================================
// LOAD SAVED STATES
// ============================================================
const savedSoundState = localStorage.getItem('dimdesk_sound_enabled');
if (savedSoundState !== null) bgmEnabled = savedSoundState === 'true';

const savedShuffleState = localStorage.getItem('dimdesk_shuffle_enabled');
if (savedShuffleState !== null) shuffleEnabled = savedShuffleState === 'true';

const savedVideoTime = parseFloat(localStorage.getItem('dimdesk_bgm_time') || '0');
const savedVideoIndex = parseInt(localStorage.getItem('dimdesk_bgm_index') || '0');

// ============================================================
// YOUTUBE PLAYER INITIALIZATION
// ============================================================
function onYouTubeIframeAPIReady() {
    youtubePlayer = new YT.Player('youtube-bgm-player', {
        height: '1',
        width: '1',
        playerVars: {
            autoplay: 0,
            controls: 0,
            disablekb: 1,
            fs: 0,
            iv_load_policy: 3,
            listType: 'playlist',
            list: PLAYLIST_ID,
            index: savedVideoIndex,
            loop: 1,
            modestbranding: 1,
            rel: 0,
            showinfo: 0,
            volume: BGM_VOLUME
        },
        events: {
            onReady: onPlayerReady,
            onStateChange: onPlayerStateChange
        }
    });
}

function onPlayerReady(event) {
    isPlayerReady = true;
    applySoundState();
    applyShuffleState();
    
    event.target.setVolume(BGM_VOLUME);
    
    // Set pending seek time
    if (savedVideoTime > 1) {
        pendingSeekTime = savedVideoTime;
    }
    
    // ONLY play if sound is enabled AND page is visible
    if (bgmEnabled && !document.hidden) {
        // Use a longer delay to ensure player is fully ready
        setTimeout(() => {
            if (youtubePlayer && bgmEnabled) {
                youtubePlayer.playVideo();
            }
        }, 2000);
    } else {
        // If muted or hidden, ensure it's paused
        event.target.pauseVideo();
    }
    
    // Show shuffle button
    document.getElementById('shuffle-toggle').style.display = 'flex';
    
    // Start periodic position saving (only if playing)
    setInterval(() => {
        if (bgmEnabled && !document.hidden && isPlayerReady) {
            savePlaybackPosition();
        }
    }, 2000);
}

function onPlayerStateChange(event) {
    // When video starts playing
    if (event.data === YT.PlayerState.PLAYING) {
        isSeekingComplete = false;
        
        // If seeking is needed
        if (pendingSeekTime > 0 && !isSeekingComplete) {
            setTimeout(() => {
                try {
                    if (youtubePlayer && pendingSeekTime > 0) {
                        youtubePlayer.seekTo(pendingSeekTime, true);
                        pendingSeekTime = 0;
                        isSeekingComplete = true;
                    }
                } catch(e) {}
            }, 800);
        }
        
        // If hidden or muted, pause immediately
        if (document.hidden || !bgmEnabled) {
            event.target.pauseVideo();
        }
    }
    
    // When video ends
    if (event.data === YT.PlayerState.ENDED) {
        localStorage.setItem('dimdesk_bgm_time', '0');
        pendingSeekTime = 0;
        
        if (shuffleEnabled && bgmEnabled && !document.hidden) {
            setTimeout(() => {
                event.target.nextVideo();
            }, 500);
        } else if (!bgmEnabled) {
            event.target.pauseVideo();
        }
    }
    
    // Save position when paused
    if (event.data === YT.PlayerState.PAUSED) {
        savePlaybackPosition();
    }
    
    // When video is cued (new video loaded)
    if (event.data === YT.PlayerState.CUED) {
        savePlaybackPosition();
        isSeekingComplete = false;
    }
}

// ============================================================
// SAVE PLAYBACK POSITION
// ============================================================
function savePlaybackPosition() {
    if (youtubePlayer && isPlayerReady) {
        try {
            const currentTime = youtubePlayer.getCurrentTime();
            const currentIndex = youtubePlayer.getPlaylistIndex();
            
            if (currentTime > 0.5) {
                localStorage.setItem('dimdesk_bgm_time', currentTime.toString());
            }
            if (currentIndex >= 0) {
                localStorage.setItem('dimdesk_bgm_index', currentIndex.toString());
            }
        } catch(e) {}
    }
}

// ============================================================
// APPLY UI STATES
// ============================================================
function applySoundState() {
    const soundIconOn = document.getElementById('sound-icon-on');
    const soundIconOff = document.getElementById('sound-icon-off');
    
    if (bgmEnabled) {
        if (soundIconOn) soundIconOn.style.display = 'block';
        if (soundIconOff) soundIconOff.style.display = 'none';
    } else {
        if (soundIconOn) soundIconOn.style.display = 'none';
        if (soundIconOff) soundIconOff.style.display = 'block';
    }
}

function applyShuffleState() {
    const shuffleBtn = document.getElementById('shuffle-toggle');
    if (shuffleBtn) {
        if (shuffleEnabled) {
            shuffleBtn.classList.add('active');
        } else {
            shuffleBtn.classList.remove('active');
        }
    }
}

// ============================================================
document.getElementById('sound-toggle').addEventListener('click', function(e) {
    e.stopPropagation();
    bgmEnabled = !bgmEnabled;
    localStorage.setItem('dimdesk_sound_enabled', bgmEnabled);
    applySoundState();
    
    if (youtubePlayer) {
        if (bgmEnabled && !document.hidden) {
            youtubePlayer.playVideo();
        } else {
            // When muted, properly pause and save position
            youtubePlayer.pauseVideo();
            youtubePlayer.mute(); // Extra safety
            savePlaybackPosition();
        }
    }
});

// ============================================================
// SHUFFLE TOGGLE
// ============================================================
document.getElementById('shuffle-toggle').addEventListener('click', function(e) {
    e.stopPropagation();
    shuffleEnabled = !shuffleEnabled;
    localStorage.setItem('dimdesk_shuffle_enabled', shuffleEnabled);
    applyShuffleState();
    
    if (youtubePlayer) {
        try {
            if (shuffleEnabled) {
                youtubePlayer.setShuffle(true);
            } else {
                youtubePlayer.setShuffle(false);
            }
        } catch(e) {}
    }
});

// ============================================================
// SAVE POSITION WHEN LEAVING PAGE
// ============================================================
window.addEventListener('beforeunload', () => {
    if (bgmEnabled) {
        savePlaybackPosition();
    }
    if (youtubePlayer) {
        try {
            youtubePlayer.pauseVideo();
            youtubePlayer.mute();
        } catch(e) {}
    }
});

// ============================================================
// TAB VISIBILITY - Fixed: muted stays muted
// ============================================================
document.addEventListener('visibilitychange', () => {
    if (youtubePlayer && isPlayerReady) {
        if (document.hidden) {
            // Save position and pause when tab hidden
            savePlaybackPosition();
            youtubePlayer.pauseVideo();
        } else {
            // Only resume if sound is enabled
            if (bgmEnabled) {
                setTimeout(() => {
                    youtubePlayer.playVideo();
                }, 500);
            } else {
                // Keep paused if muted
                youtubePlayer.pauseVideo();
            }
        }
    }
});

// ============================================================
applySoundState();
applyShuffleState();

// CUTE CLICK SOUND
// ============================================================
const audioContext = new (window.AudioContext || window.webkitAudioContext)();

document.addEventListener('click', (e) => {
    if (bgmEnabled && e.target.closest('a, button, .featured-card, .project-card, .game-link, .socialIcons a, .skill-card')) {
        playCuteClick();
    }
});

function playCuteClick() {
    if (audioContext.state === 'suspended') audioContext.resume();
    
    const now = audioContext.currentTime;
    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();
    
    osc.connect(gain);
    gain.connect(audioContext.destination);
    
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, now);
    osc.frequency.exponentialRampToValueAtTime(1320, now + 0.04);
    osc.frequency.exponentialRampToValueAtTime(440, now + 0.08);
    
    gain.gain.setValueAtTime(0.04, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
    
    osc.start(now);
    osc.stop(now + 0.1);
}

            createSparkle(x, y) { const type = Math.random(); if (type < 0.35) this.createParticle(x, y); else if (type < 0.65) this.createStar(x, y); else this.createDiamond(x, y); },
