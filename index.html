<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="DimDesk.Studios - Independent game development portfolio">
    <title>DimDesk.Studios - Game Developer Portfolio</title>
    <link rel="icon" type="image/ico" href="Icon.ico" />
    <style>
        :root {
            --bg: #0a0a0a;
            --bg2: #1a1a1a;
            --text: #fff;
            --text2: #b0b0b0;
            --accent: #f08080;
            --border: rgba(255,255,255,0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            line-height: 1.5;
            overflow-x: hidden;
        }
        
        /* Sparkle overlay */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            background-image: 
                radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,0.4), transparent),
                radial-gradient(2px 2px at 40% 70%, rgba(255,215,0,0.3), transparent),
                radial-gradient(3px 3px at 60% 20%, rgba(255,255,255,0.3), transparent),
                radial-gradient(2px 2px at 80% 60%, rgba(255,215,0,0.2), transparent),
                radial-gradient(2px 2px at 10% 80%, rgba(255,255,255,0.4), transparent),
                radial-gradient(3px 3px at 70% 90%, rgba(255,215,0,0.3), transparent),
                radial-gradient(2px 2px at 30% 50%, rgba(255,255,255,0.3), transparent),
                radial-gradient(2px 2px at 90% 30%, rgba(255,215,0,0.2), transparent);
            animation: sparkleTwinkle 3s ease-in-out infinite;
        }
        
        @keyframes sparkleTwinkle {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }
        
        .background-video { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: -1; 
        }
        .background-video video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            filter: brightness(0.25);
        }
        .background-video::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, 
                rgba(10, 10, 10, 0.85) 0%,
                rgba(240, 128, 128, 0.15) 50%,
                rgba(10, 10, 10, 0.85) 100%);
            animation: glowPulse 8s ease-in-out infinite;
        }
        
        @keyframes glowPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.85; }
        }
        
        .HE { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 0.75rem 2rem; 
            background: rgba(15,15,15,0.95); 
            border-bottom: 1px solid rgba(240, 128, 128, 0.2); 
            position: sticky; 
            top: 0; 
            z-index: 1000;
            box-shadow: 0 0 20px rgba(240, 128, 128, 0.1);
        }
        .logo-container { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            text-decoration: none; 
            color: var(--text); 
        }
        .logo-img { 
            width: 45px; 
            height: 45px; 
            border-radius: 8px; 
            border: 2px solid var(--accent);
            box-shadow: 0 0 15px rgba(240, 128, 128, 0.3);
        }
        .nav-links ul { 
            display: flex; 
            list-style: none; 
            gap: 0.5rem; 
        }
        .nav-links a { 
            color: var(--text2); 
            text-decoration: none; 
            padding: 0.5rem 1rem; 
            border-radius: 6px; 
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }
        .nav-links a:hover, .nav-links a.current-page { 
            color: var(--text); 
            background: rgba(240, 128, 128, 0.1);
            box-shadow: 0 0 10px rgba(240, 128, 128, 0.2);
        }
        
        .hero-section {
            text-align: center;
            margin: 40px auto;
            padding: 0 20px;
            max-width: 800px;
        }
        .hero-logo {
            max-width: 350px;
            width: 100%;
            height: auto;
            margin: 20px auto;
            filter: drop-shadow(0 5px 15px rgba(240, 128, 128, 0.3));
        }
        .hero-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin: 10px 0;
            text-shadow: 0 0 20px rgba(240, 128, 128, 0.5);
        }
        .hero-subtitle {
            color: var(--text2);
            font-size: 1.1rem;
        }
        
        .section-header {
            text-align: center;
            margin: 40px auto 20px;
            max-width: 800px;
        }
        .section-title {
            font-size: 1.8rem;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(240, 128, 128, 0.4);
        }
        .section-divider {
            width: 60px;
            height: 3px;
            background: var(--accent);
            margin: 10px auto;
            border-radius: 2px;
            box-shadow: 0 0 10px rgba(240, 128, 128, 0.5);
        }
        
        .featured-section, .projects-section {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
        }
        .featured-grid, .projects-grid {
            display: grid;
            gap: 20px;
            margin-top: 20px;
        }
        .featured-grid { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
        .projects-grid { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
        
        .featured-card, .project-card {
            background: var(--bg2);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(240, 128, 128, 0.2);
            transition: all 0.3s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .featured-card:hover, .project-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent);
            box-shadow: 0 10px 30px rgba(240, 128, 128, 0.3);
        }
        .featured-image, .project-image {
            width: 100%;
            height: 180px;
            overflow: hidden;
        }
        .project-image { height: 160px; }
        .featured-image img, .project-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        .featured-card:hover .featured-image img,
        .project-card:hover .project-image img { transform: scale(1.03); }
        
        .featured-content, .project-content {
            padding: 15px 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .featured-content h3, .project-content h3 {
            font-size: 1.1rem;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .featured-content p, .project-content p {
            color: var(--text2);
            font-size: 0.9rem;
            line-height: 1.5;
            flex: 1;
        }
        .project-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 10px;
        }
        .project-tag, .featured-tag {
            background: rgba(240, 128, 128, 0.2);
            color: var(--accent);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 500;
        }
        
        footer {
            background: rgba(15,15,15,0.9);
            padding: 25px 15px;
            margin-top: 40px;
            border-top: 1px solid rgba(240, 128, 128, 0.2);
            text-align: center;
        }
        .socialIcons {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .socialIcons a {
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.05);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .socialIcons a:hover {
            background: rgba(240, 128, 128, 0.2);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(240, 128, 128, 0.3);
        }
        .Oo { color: #808080; font-size: 0.8rem; }
        .Oo a { color: #808080; text-decoration: none; }
        .Oo a:hover { color: var(--text); }
        
        .mobile-toggle {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            width: 40px;
            height: 40px;
        }
        .mobile-toggle span {
            display: block;
            width: 20px;
            height: 2px;
            background: var(--text);
            margin: 2px 0;
        }
        
        @media (max-width: 768px) {
            .mobile-toggle { display: flex !important; flex-direction: column; justify-content: center; align-items: center; }
            .nav-links { 
                position: fixed; 
                top: 0; 
                right: -100%; 
                width: 250px; 
                height: 100vh; 
                background: rgba(15,15,15,0.98); 
                padding: 80px 15px 20px; 
                transition: right 0.3s; 
                z-index: 999;
            }
            .nav-links.active { right: 0; }
            .nav-links ul { flex-direction: column; }
            .nav-links li { width: 100%; list-style: none; }
            .nav-links a { display: block; padding: 12px 15px; }
        }
    </style>
</head>
<body>
    <div class="background-video">
        <video autoplay muted loop playsinline id="bg-video">
            <source src="D.mp4" type="video/mp4">
        </video>
    </div>
    
    <header>
        <div class="HE">
            <a href="index.html" class="logo-container">
                <img src="cat.png" alt="DimDesk" class="logo-img">
                <span>DimDesk.Studios</span>
            </a>
            <nav class="nav-links" id="main-nav">
                <ul>
                    <li><a href="index.html" class="current-page">Home</a></li>
                    <li><a href="portfolio.html">Portfolio</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
            <button class="mobile-toggle" id="mobile-toggle"><span></span><span></span><span></span></button>
        </div>
    </header>

    <div class="hero-section">
        <img src="logo2.png" alt="DimDesk Studios" class="hero-logo">
        <h1 class="hero-title">DimDesk.Studios</h1>
        <p class="hero-subtitle">Independent Game Developer & Artist</p>
    </div>

    <main>
        <section class="featured-section">
            <div class="section-header">
                <h2 class="section-title">Featured Projects</h2>
                <div class="section-divider"></div>
            </div>
            <div class="featured-grid" id="featured-grid"></div>
        </section>

        <section class="projects-section">
            <div class="section-header">
                <h2 class="section-title">Released Games</h2>
                <div class="section-divider"></div>
            </div>
            <div class="projects-grid" id="released-games"></div>
        </section>

        <section class="projects-section">
            <div class="section-header">
                <h2 class="section-title">Upcoming Projects</h2>
                <div class="section-divider"></div>
            </div>
            <div class="projects-grid" id="upcoming-projects"></div>
        </section>
    </main>

    <footer>
        <div class="socialIcons">
            <a href="https://bsky.app/profile/fubiem.bsky.social" target="_blank" title="Bluesky">☁️</a>
            <a href="https://www.youtube.com/@fubiereal" target="_blank" title="YouTube">▶️</a>
            <a href="https://www.patreon.com/c/DIMDESK" target="_blank" title="Patreon">⭐</a>
            <a href="https://dimdesk.itch.io" target="_blank" title="Itch.io">🎮</a>
            <a href="https://cara.app/fubie/all" target="_blank" title="Cara">🎨</a>
        </div>
        <div class="Oo">
            <p>Contact: <a href="mailto:dimdesk.contact@gmail.com">dimdesk.contact@gmail.com</a></p>
            <p>© 2025 DimDesk.Studios</p>
        </div>
    </footer>

    <script>
        // Smooth video looping
        const video = document.getElementById('bg-video');
        if (video) {
            video.addEventListener('timeupdate', function() {
                if (video.currentTime >= video.duration - 0.15) {
                    video.currentTime = 0;
                    video.play();
                }
            });
            video.addEventListener('ended', function() {
                video.currentTime = 0;
                video.play();
            });
            video.addEventListener('stalled', function() {
                video.play();
            });
        }

        // Mobile navigation
        document.getElementById('mobile-toggle').addEventListener('click', function() {
            document.getElementById('main-nav').classList.toggle('active');
        });

        // Game data
        const gameData = {
            featured: [
                { title: "Echoes of Aether", desc: "Puzzle-platformer with sound mechanics", img: "https://via.placeholder.com/400x200/2c3e50/fff?text=Echoes", tags: ["Unity", "C#"] },
                { title: "Project: Chronos", desc: "Time-bending action RPG", img: "https://via.placeholder.com/400x200/8e44ad/fff?text=Chronos", tags: ["Unreal 5", "RPG"] }
            ],
            released: [
                { title: "Echoes of Aether", desc: "Puzzle-platformer with sound manipulation", img: "https://via.placeholder.com/280x160/2c3e50/fff?text=Echoes", tags: ["Unity", "C#", "2D"] },
                { title: "Starlight Drifter", desc: "Space exploration with narrative focus", img: "https://via.placeholder.com/280x160/8e44ad/fff?text=Starlight", tags: ["Unreal", "C++"] },
                { title: "Neon Abyss", desc: "Cyberpunk roguelike shooter", img: "https://via.placeholder.com/280x160/c0392b/fff?text=Neon", tags: ["Godot"] }
            ],
            upcoming: [
                { title: "Project: Chronos", desc: "Time-bending RPG", img: "https://via.placeholder.com/280x160/16a085/fff?text=Chronos", tags: ["Unreal 5"] },
                { title: "Paper Lanterns", desc: "Cozy management sim", img: "https://via.placeholder.com/280x160/f39c12/fff?text=Lanterns", tags: ["Unity"] }
            ]
        };

        function createCard(game, isFeatured = false) {
            return `
                <div class="${isFeatured ? 'featured-card' : 'project-card'}">
                    <div class="${isFeatured ? 'featured-image' : 'project-image'}">
                        <img src="${game.img}" alt="${game.title}">
                    </div>
                    <div class="${isFeatured ? 'featured-content' : 'project-content'}">
                        <h3>${game.title}</h3>
                        <p>${game.desc}</p>
                        <div class="project-tags">${game.tags.map(t => `<span class="project-tag">${t}</span>`).join('')}</div>
                    </div>
                </div>`;
        }

        document.getElementById('featured-grid').innerHTML = gameData.featured.map(g => createCard(g, true)).join('');
        document.getElementById('released-games').innerHTML = gameData.released.map(g => createCard(g)).join('');
        document.getElementById('upcoming-projects').innerHTML = gameData.upcoming.map(g => createCard(g)).join('');
    </script>
</body>
</html>
