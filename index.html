<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="description" content="DimDesk.Studios - Independent game development portfolio">
    <title>DimDesk.Studios - Game Developer Portfolio</title>
    <link rel="icon" type="image/ico" href="Icon.ico" />
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --accent: #f08080;
            --border: rgba(255,255,255,0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
        }
        .background-video {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; overflow: hidden;
        }
        .background-video video {
            width: 100%; height: 100%; object-fit: cover;
            filter: brightness(0.25);
        }
        .video-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(10,10,10,0.9), rgba(30,30,30,0.7));
        }
        .HE {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0.75rem 2rem; background: rgba(15,15,15,0.95);
            backdrop-filter: blur(10px); border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 1000;
        }
        .logo-container {
            display: flex; align-items: center; gap: 12px;
            text-decoration: none; color: var(--text-primary);
        }
        .logo-img {
            width: 45px; height: 45px; border-radius: 8px;
            border: 2px solid var(--accent); object-fit: cover;
        }
        .logo-text {
            font-size: 1.2rem; font-weight: 700; letter-spacing: -0.5px;
        }
        .nav-links ul {
            display: flex; list-style: none; gap: 0.5rem;
            align-items: center; margin: 0; padding: 0;
        }
        .nav-links a {
            color: var(--text-secondary); text-decoration: none;
            font-weight: 500; font-size: 0.85rem; padding: 0.5rem 1rem;
            border-radius: 6px; transition: all 0.2s;
        }
        .nav-links a:hover, .nav-links a.current-page {
            color: var(--text-primary); background: rgba(255,255,255,0.1);
        }
        .hero-section {
            text-align: center; margin: 40px auto; padding: 0 20px; max-width: 800px;
        }
        .hero-logo {
            max-width: 350px; width: 100%; height: auto; margin: 20px auto;
            filter: drop-shadow(0 5px 15px rgba(240,128,128,0.3));
        }
        .hero-title { font-size: 2.5rem; font-weight: 700; margin: 10px 0; }
        .hero-subtitle { color: var(--text-secondary); font-size: 1.1rem; }
        .section-header {
            text-align: center; margin: 40px auto 20px; max-width: 800px;
        }
        .section-title { font-size: 1.8rem; font-weight: 600; }
        .section-divider {
            width: 60px; height: 3px; background: var(--accent);
            margin: 10px auto; border-radius: 2px;
        }
        .featured-section, .projects-section {
            max-width: 1200px; margin: 20px auto; padding: 0 20px;
        }
        .featured-grid, .projects-grid {
            display: grid; gap: 20px; margin-top: 20px;
        }
        .featured-grid { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
        .projects-grid { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
        .featured-card, .project-card {
            background: var(--bg-secondary); border-radius: 8px;
            overflow: hidden; border: 1px solid var(--border);
            transition: all 0.3s; cursor: pointer; display: flex; flex-direction: column;
        }
        .featured-card:hover, .project-card:hover {
            transform: translateY(-3px); border-color: var(--accent);
            box-shadow: 0 10px 30px rgba(240,128,128,0.2);
        }
        .featured-image, .project-image {
            width: 100%; height: 180px; overflow: hidden;
        }
        .project-image { height: 160px; }
        .featured-image img, .project-image img {
            width: 100%; height: 100%; object-fit: cover;
            transition: transform 0.3s;
        }
        .featured-card:hover .featured-image img,
        .project-card:hover .project-image img { transform: scale(1.03); }
        .featured-content, .project-content {
            padding: 15px 20px; flex: 1; display: flex; flex-direction: column;
        }
        .featured-content h3, .project-content h3 {
            font-size: 1.1rem; margin-bottom: 8px; font-weight: 600;
        }
        .featured-content p, .project-content p {
            color: var(--text-secondary); font-size: 0.9rem;
            line-height: 1.5; flex: 1;
        }
        .project-tags {
            display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px;
        }
        .project-tag, .featured-tag {
            background: rgba(240,128,128,0.2); color: var(--accent);
            padding: 2px 8px; border-radius: 4px; font-size: 0.7rem;
            font-weight: 500;
        }
        .platform-badge {
            display: inline-block; padding: 2px 8px; border-radius: 4px;
            font-size: 0.7rem; font-weight: 600; margin-left: 8px;
            background: rgba(255,255,255,0.1); color: var(--text-primary);
        }
        .platform-links {
            display: flex; gap: 8px; margin-top: 10px;
        }
        .platform-link {
            padding: 6px 12px; border-radius: 4px; font-size: 0.75rem;
            text-decoration: none; font-weight: 500; transition: all 0.2s;
            background: rgba(255,255,255,0.05); color: var(--text-secondary);
            border: 1px solid var(--border);
        }
        .platform-link:hover {
            background: var(--accent); color: #000; border-color: var(--accent);
        }
        footer {
            background: rgba(15,15,15,0.9); padding: 25px 15px;
            margin-top: 40px; border-top: 1px solid var(--border);
        }
        .footerContainer { max-width: 800px; margin: 0 auto; text-align: center; }
        .socialIcons {
            display: flex; justify-content: center; gap: 12px;
            margin-bottom: 15px; flex-wrap: wrap;
        }
        .socialIcons a {
            display: flex; align-items: center; justify-content: center;
            width: 35px; height: 35px; background: rgba(255,255,255,0.05);
            border-radius: 50%; transition: all 0.3s;
        }
        .socialIcons a:hover { background: rgba(255,255,255,0.2); }
        .Oo { color: #808080; font-size: 0.8rem; }
        .Oo a { color: #808080; text-decoration: none; }
        .Oo a:hover { color: var(--text-primary); }
        .footerBottom { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
        .footerBottom p { color: #606060; font-size: 0.75rem; }
        .mobile-toggle {
            display: none; background: none; border: none; cursor: pointer;
            padding: 8px; width: 40px; height: 40px; border-radius: 6px;
        }
        .mobile-toggle span {
            display: block; width: 20px; height: 2px;
            background: var(--text-primary); margin: 2px 0; transition: 0.3s;
        }
        @media (max-width: 768px) {
            .mobile-toggle { display: flex !important; flex-direction: column; justify-content: center; align-items: center; }
            .nav-links {
                position: fixed; top: 0; right: -100%; width: 250px; height: 100vh;
                background: rgba(15,15,15,0.98); padding: 80px 15px 20px;
                z-index: 1000; transition: right 0.3s; overflow-y: auto;
            }
            .nav-links.active { right: 0; }
            .nav-links ul { flex-direction: column; gap: 5px; }
            .nav-links li { width: 100%; list-style: none; }
            .nav-links a { padding: 12px 15px; display: block; }
            .HE { padding: 10px 15px; }
            .logo-img { width: 40px; height: 40px; }
            .logo-text { font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="background-video">
        <video autoplay muted loop playsinline>
            <source src="D.mp4" type="video/mp4">
        </video>
        <div class="video-overlay"></div>
    </div>

    <div class="Container">
        <div class="content">
            <header>
                <div class="HE">
                    <a href="index.html" class="logo-container">
                        <img src="cat.png" alt="DimDesk Studios" class="logo-img" onerror="this.style.display='none'">
                        <span class="logo-text">DimDesk.Studios</span>
                    </a>
                    <nav class="nav-links" id="main-nav">
                        <ul>
                            <li><a href="index.html" class="current-page">Home</a></li>
                            <li><a href="portfolio.html">Portfolio</a></li>
                            <li><a href="contact.html">Contact</a></li>
                        </ul>
                    </nav>
                    <button class="mobile-toggle" id="mobile-toggle">
                        <span></span><span></span><span></span>
                    </button>
                </div>
            </header>

            <div class="hero-section">
                <img src="logo2.png" alt="DimDesk Studios" class="hero-logo" onerror="this.style.display='none'">
                <h1 class="hero-title">DimDesk.Studios</h1>
                <p class="hero-subtitle">Independent Game Developer & Artist</p>
            </div>

            <main>
                <section class="featured-section">
                    <div class="section-header">
                        <h2 class="section-title">Featured Projects</h2>
                        <div class="section-divider"></div>
                    </div>
                    <div class="featured-grid" id="featured-grid"></div>
                </section>

                <section class="projects-section">
                    <div class="section-header">
                        <h2 class="section-title">Released Games</h2>
                        <div class="section-divider"></div>
                    </div>
                    <div class="projects-grid" id="released-games"></div>
                </section>

                <section class="projects-section">
                    <div class="section-header">
                        <h2 class="section-title">Upcoming Projects</h2>
                        <div class="section-divider"></div>
                    </div>
                    <div class="projects-grid" id="upcoming-projects"></div>
                </section>
            </main>
        </div>
    </div>

    <footer>
        <div class="footerContainer">
            <div class="socialIcons">
                <a href="https://bsky.app/profile/fubiem.bsky.social" target="_blank">☁️</a>
                <a href="https://www.youtube.com/@fubiereal" target="_blank">▶️</a>
                <a href="https://www.patreon.com/c/DIMDESK" target="_blank">⭐</a>
                <a href="https://dimdesk.itch.io" target="_blank">🎮</a>
                <a href="https://cara.app/fubie/all" target="_blank">🎨</a>
            </div>
            <div class="Oo">
                <p>Contact: <a href="mailto:dimdesk.contact@gmail.com">dimdesk.contact@gmail.com</a></p>
                <div class="footerBottom">
                    <p>© 2025 DimDesk.Studios</p>
                </div>
            </div>
        </div>
    </footer>

    <script>
        // EASY UPDATE: Edit this data to change your games
        const gameData = {
            featured: [
                { title: "Echoes of Aether", desc: "Puzzle-platformer with sound mechanics", img: "https://via.placeholder.com/400x200/2c3e50/fff?text=Echoes", tags: ["Unity", "C#"], platforms: ["Steam", "itch.io"], links: { "Steam": "https://store.steampowered.com", "itch.io": "https://dimdesk.itch.io" } },
                { title: "Project: Chronos", desc: "Time-bending action RPG", img: "https://via.placeholder.com/400x200/8e44ad/fff?text=Chronos", tags: ["Unreal 5", "RPG"], platforms: ["Coming Soon"], links: {} }
            ],
            released: [
                { title: "Echoes of Aether", desc: "Puzzle-platformer with sound manipulation", img: "https://via.placeholder.com/280x160/2c3e50/fff?text=Echoes", tags: ["Unity", "C#", "2D"], platforms: ["Steam", "itch.io"], links: { "Steam": "#", "itch.io": "#" } },
                { title: "Starlight Drifter", desc: "Space exploration with narrative focus", img: "https://via.placeholder.com/280x160/8e44ad/fff?text=Starlight", tags: ["Unreal", "C++"], platforms: ["Steam"], links: { "Steam": "#" } },
                { title: "Neon Abyss", desc: "Cyberpunk roguelike shooter", img: "https://via.placeholder.com/280x160/c0392b/fff?text=Neon", tags: ["Godot"], platforms: ["itch.io"], links: { "itch.io": "#" } }
            ],
            upcoming: [
                { title: "Project: Chronos", desc: "Time-bending RPG", img: "https://via.placeholder.com/280x160/16a085/fff?text=Chronos", tags: ["Unreal 5"], platforms: ["TBA"], links: {} },
                { title: "Paper Lanterns", desc: "Cozy management sim", img: "https://via.placeholder.com/280x160/f39c12/fff?text=Lanterns", tags: ["Unity"], platforms: ["TBA"], links: {} }
            ]
        };

        function createCard(game) {
            return `
                <div class="project-card">
                    <div class="project-image"><img src="${game.img}" alt="${game.title}"></div>
                    <div class="project-content">
                        <h3>${game.title} ${game.platforms.map(p => `<span class="platform-badge">${p}</span>`).join('')}</h3>
                        <p>${game.desc}</p>
                        <div class="project-tags">${game.tags.map(t => `<span class="project-tag">${t}</span>`).join('')}</div>
                        ${Object.entries(game.links).map(([name, url]) => `<a href="${url}" class="platform-link" target="_blank">${name}</a>`).join('')}
                    </div>
                </div>`;
        }

        document.getElementById('featured-grid').innerHTML = gameData.featured.map(createCard).join('');
        document.getElementById('released-games').innerHTML = gameData.released.map(createCard).join('');
        document.getElementById('upcoming-projects').innerHTML = gameData.upcoming.map(createCard).join('');

        // Mobile menu toggle
        document.getElementById('mobile-toggle').addEventListener('click', function() {
            document.getElementById('main-nav').classList.toggle('active');
            this.classList.toggle('active');
        });
    </script>
</body>
</html>
