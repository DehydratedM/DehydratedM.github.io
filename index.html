<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="DimDesk.Studios - Independent game development portfolio">

    <link rel="icon" type="image/ico" href="Icon.ico" />
    <style>
        :root {
            --bg: #0a0a0a;
            --bg2: #1a1a1a;
            --text: #fff;
            --text2: #b0b0b0;
            --accent: #f08080;
            --border: rgba(255,255,255,0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            line-height: 1.5;
            overflow-x: hidden;
        }
        
        /* Sparkle overlay */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            background-image: 
                radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,0.4), transparent),
                radial-gradient(2px 2px at 40% 70%, rgba(255,215,0,0.3), transparent),
                radial-gradient(3px 3px at 60% 20%, rgba(255,255,255,0.3), transparent),
                radial-gradient(2px 2px at 80% 60%, rgba(255,215,0,0.2), transparent),
                radial-gradient(2px 2px at 10% 80%, rgba(255,255,255,0.4), transparent),
                radial-gradient(3px 3px at 70% 90%, rgba(255,215,0,0.3), transparent),
                radial-gradient(2px 2px at 30% 50%, rgba(255,255,255,0.3), transparent),
                radial-gradient(2px 2px at 90% 30%, rgba(255,215,0,0.2), transparent),
                radial-gradient(3px 3px at 50% 10%, rgba(255,255,255,0.2), transparent),
                radial-gradient(2px 2px at 15% 60%, rgba(255,215,0,0.3), transparent),
                radial-gradient(3px 3px at 75% 40%, rgba(255,255,255,0.2), transparent),
                radial-gradient(2px 2px at 45% 90%, rgba(255,215,0,0.3), transparent);
            animation: sparkleTwinkle 2.5s ease-in-out infinite;
        }
        
        @keyframes sparkleTwinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        
        /* Mouse-following sparkle trail */
        .sparkle-trail {
            position: fixed;
            pointer-events: none;
            z-index: 99999;
            animation: sparkleFade 0.8s ease-out forwards;
        }
        
        @keyframes sparkleFade {
            0% { transform: scale(1) rotate(0deg); opacity: 1; }
            100% { transform: scale(0) rotate(180deg); opacity: 0; }
        }
        
        .background-video { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: -1; 
        }
        .background-video video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            filter: brightness(0.25);
        }
        .background-video::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, 
                rgba(10, 10, 10, 0.85) 0%,
                rgba(240, 128, 128, 0.15) 50%,
                rgba(10, 10, 10, 0.85) 100%);
            animation: glowPulse 8s ease-in-out infinite;
        }
        
        @keyframes glowPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.85; }
        }
        
        .HE { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 0.75rem 2rem; 
            background: rgba(15,15,15,0.95); 
            border-bottom: 1px solid rgba(240, 128, 128, 0.2); 
            position: sticky; 
            top: 0; 
            z-index: 1000;
            box-shadow: 0 0 20px rgba(240, 128, 128, 0.1);
        }
        .logo-container { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            text-decoration: none; 
            color: var(--text); 
        }
        .logo-img { 
            width: 45px; 
            height: 45px; 
            border-radius: 8px; 
            border: 2px solid var(--accent);
            box-shadow: 0 0 15px rgba(240, 128, 128, 0.3);
        }
        .nav-links ul { 
            display: flex; 
            list-style: none; 
            gap: 0.5rem; 
        }
        .nav-links a { 
            color: var(--text2); 
            text-decoration: none; 
            padding: 0.5rem 1rem; 
            border-radius: 6px; 
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }
        .nav-links a:hover, .nav-links a.current-page { 
            color: var(--text); 
            background: rgba(240, 128, 128, 0.1);
            box-shadow: 0 0 10px rgba(240, 128, 128, 0.2);
        }
        
        .hero-section {
            text-align: center;
            margin: 40px auto;
            padding: 0 20px;
            max-width: 800px;
        }
        .hero-logo {
            max-width: 350px;
            width: 100%;
            height: auto;
            margin: 20px auto;
            filter: drop-shadow(0 5px 15px rgba(240, 128, 128, 0.3));
        }
        .hero-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin: 10px 0;
            text-shadow: 0 0 20px rgba(240, 128, 128, 0.5);
        }
        .hero-subtitle {
            color: var(--text2);
            font-size: 1.1rem;
        }
        
        .section-header {
            text-align: center;
            margin: 40px auto 20px;
            max-width: 800px;
        }
        .section-title {
            font-size: 1.8rem;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(240, 128, 128, 0.4);
        }
        .section-divider {
            width: 60px;
            height: 3px;
            background: var(--accent);
            margin: 10px auto;
            border-radius: 2px;
            box-shadow: 0 0 10px rgba(240, 128, 128, 0.5);
        }
        
        .featured-section, .projects-section {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
        }
        .featured-grid, .projects-grid {
            display: grid;
            gap: 20px;
            margin-top: 20px;
        }
        .featured-grid { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
        .projects-grid { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
        
        .featured-card, .project-card {
            background: var(--bg2);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(240, 128, 128, 0.2);
            transition: all 0.3s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .featured-card:hover, .project-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent);
            box-shadow: 0 10px 30px rgba(240, 128, 128, 0.3);
        }
        
        /* Game media styles */
        .game-media {
            position: relative;
            width: 100%;
            height: 180px;
            overflow: hidden;
            background: #000;
        }
        .project-card .game-media { height: 160px; }
        
        .game-media video,
        .game-media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        .game-media:hover video,
        .game-media:hover img {
            transform: scale(1.05);
        }
        
        .play-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 20px;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
        }
        .game-media:hover .play-indicator { opacity: 1; }
        
        .featured-content, .project-content {
            padding: 15px 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .featured-content h3, .project-content h3 {
            font-size: 1.1rem;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .featured-content p, .project-content p {
            color: var(--text2);
            font-size: 0.9rem;
            line-height: 1.5;
            flex: 1;
        }
        .project-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 10px;
        }
        .project-tag {
            background: rgba(240, 128, 128, 0.2);
            color: var(--accent);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 500;
        }
        
        .platform-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 8px;
        }
        .platform-badge {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
        }
        .game-links {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }
        .game-link {
            padding: 4px 10px;
            background: rgba(240, 128, 128, 0.2);
            color: #f08080;
            text-decoration: none;
            border-radius: 4px;
            font-size: 0.75rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .game-link:hover {
            background: rgba(240, 128, 128, 0.4);
            color: #fff;
            transform: translateY(-2px);
        }
        
        footer {
            background: rgba(15,15,15,0.9);
            padding: 25px 15px;
            margin-top: 40px;
            border-top: 1px solid rgba(240, 128, 128, 0.2);
            text-align: center;
        }
        .socialIcons {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .socialIcons a {
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.05);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .socialIcons a:hover {
            background: rgba(240, 128, 128, 0.2);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(240, 128, 128, 0.3);
        }
        .Oo { color: #808080; font-size: 0.8rem; }
        .Oo a { color: #808080; text-decoration: none; }
        .Oo a:hover { color: var(--text); }
        
        .mobile-toggle {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            width: 40px;
            height: 40px;
        }
        .mobile-toggle span {
            display: block;
            width: 20px;
            height: 2px;
            background: var(--text);
            margin: 2px 0;
        }
        
        @media (max-width: 768px) {
            .mobile-toggle { display: flex !important; flex-direction: column; justify-content: center; align-items: center; }
            .nav-links { 
                position: fixed; 
                top: 0; 
                right: -100%; 
                width: 250px; 
                height: 100vh; 
                background: rgba(15,15,15,0.98); 
                padding: 80px 15px 20px; 
                transition: right 0.3s; 
                z-index: 999;
            }
            .nav-links.active { right: 0; }
            .nav-links ul { flex-direction: column; }
            .nav-links li { width: 100%; list-style: none; }
            .nav-links a { display: block; padding: 12px 15px; }
        }
    </style>
</head>

        // Enhanced createCard function with video support
        function createCard(game, isFeatured = false) {
            const mediaHTML = game.video ? `
                <div class="game-media">
                    <video src="${game.video}" muted loop 
                           onmouseover="this.play()" 
                           onmouseout="this.pause(); this.currentTime=0;">
                    </video>
                    <div class="play-indicator">▶</div>
                </div>
            ` : `
                <div class="game-media">
                    <img src="${game.img}" alt="${game.title}" loading="lazy">
                </div>
            `;
            
            return `
                <div class="${isFeatured ? 'featured-card' : 'project-card'}">
                    ${mediaHTML}
                    <div class="${isFeatured ? 'featured-content' : 'project-content'}">
                        <h3>${game.title}</h3>
                        <p>${game.desc}</p>
                        <div class="project-tags">${game.tags.map(t => `<span class="project-tag">${t}</span>`).join('')}</div>
                        ${game.platforms ? `<div class="platform-badges">${game.platforms.map(p => `<span class="platform-badge">${p}</span>`).join('')}</div>` : ''}
                        ${game.links && Object.keys(game.links).length > 0 ? `
                            <div class="game-links">
                                ${Object.entries(game.links).map(([name, url]) => 
                                    `<a href="${url}" target="_blank" class="game-link" onclick="event.stopPropagation()">${name}</a>`
                                ).join('')}
                            </div>
                        ` : ''}
                    </div>
                </div>`;
        }

        // Show game details in modal
        function showGameDetails(game) {
            const modalOverlay = document.createElement('div');
            modalOverlay.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.9);
                z-index: 10000;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
                animation: fadeIn 0.3s ease;
            `;
            
            const modalContent = document.createElement('div');
            modalContent.style.cssText = `
                background: #1a1a1a;
                border-radius: 12px;
                padding: 25px;
                max-width: 600px;
                width: 100%;
                max-height: 90vh;
                overflow-y: auto;
                border: 2px solid #f08080;
                box-shadow: 0 0 30px rgba(240, 128, 128, 0.3);
                position: relative;
            `;
            
            modalContent.innerHTML = `
                <button onclick="this.closest('div').parentElement.remove()" 
                        style="position: absolute; top: 10px; right: 10px; background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; z-index: 10001;">
                    &times;
                </button>
                <h2 style="color: #fff; margin-bottom: 15px;">${game.title}</h2>
                ${game.video ? `
                    <video src="${game.video}" controls autoplay 
                           style="width: 100%; border-radius: 8px; margin-bottom: 15px;">
                    </video>
                ` : `
                    <img src="${game.img}" alt="${game.title}" 
                         style="width: 100%; border-radius: 8px; margin-bottom: 15px;">
                `}
                <p style="color: #b0b0b0; margin-bottom: 15px;">${game.desc}</p>
                <div style="margin-bottom: 15px;">
                    ${game.tags.map(t => `<span style="background: rgba(240,128,128,0.2); color: #f08080; padding: 4px 10px; border-radius: 4px; font-size: 0.75rem; margin-right: 5px;">${t}</span>`).join('')}
                </div>
                ${game.platforms ? `
                    <div style="margin-bottom: 15px;">
                        <strong style="color: #fff;">Platforms:</strong>
                        ${game.platforms.map(p => `<span style="color: #b0b0b0; margin-left: 5px;">${p}</span>`).join('')}
                    </div>
                ` : ''}
                ${game.links && Object.keys(game.links).length > 0 ? `
                    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                        ${Object.entries(game.links).map(([name, url]) => 
                            `<a href="${url}" target="_blank" 
                                style="padding: 8px 15px; background: #f08080; color: #000; text-decoration: none; border-radius: 6px; font-weight: 600;">
                                ${name}
                            </a>`
                        ).join('')}
                    </div>
                ` : ''}
            `;
            
            modalOverlay.appendChild(modalContent);
            document.body.appendChild(modalOverlay);
            
            modalOverlay.addEventListener('click', function(e) {
                if (e.target === modalOverlay) {
                    modalOverlay.remove();
                }
            });
            
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    modalOverlay.remove();
                }
            });
        }

        // Render cards
        document.getElementById('featured-grid').innerHTML = gameData.featured.map(g => createCard(g, true)).join('');
        document.getElementById('released-games').innerHTML = gameData.released.map(g => createCard(g)).join('');
        document.getElementById('upcoming-projects').innerHTML = gameData.upcoming.map(g => createCard(g)).join('');

        // Mouse-following sparkle effect
        let lastSparkleTime = 0;
        document.addEventListener('mousemove', function(e) {
            const now = Date.now();
            if (now - lastSparkleTime < 150) return;
            lastSparkleTime = now;
            
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle-trail';
            const sparkles = ['✨', '⭐', '💫', '🌟'];
            sparkle.textContent = sparkles[Math.floor(Math.random() * sparkles.length)];
            sparkle.style.left = (e.clientX + (Math.random() - 0.5) * 15) + 'px';
            sparkle.style.top = (e.clientY + (Math.random() - 0.5) * 15) + 'px';
            sparkle.style.fontSize = (8 + Math.random() * 12) + 'px';
            document.body.appendChild(sparkle);
            setTimeout(() => sparkle.remove(), 800);
        });
    </script>
</body>
</html>
