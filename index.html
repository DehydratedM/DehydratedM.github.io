    <style>
        :root {
            --bg: #0a0a0a;
            --bg2: #1a1a1a;
            --text: #fff;
            --text2: #b0b0b0;
            --accent: #f08080;
            --border: rgba(255,255,255,0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            line-height: 1.5;
            overflow-x: hidden;
        }
        
        /* Static sparkle overlay - WHITE PARTICLES */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            background-image: 
                radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,0.6), transparent),
                radial-gradient(2px 2px at 40% 70%, rgba(255,255,255,0.4), transparent),
                radial-gradient(3px 3px at 60% 20%, rgba(255,255,255,0.5), transparent),
                radial-gradient(2px 2px at 80% 60%, rgba(255,255,255,0.3), transparent),
                radial-gradient(2px 2px at 10% 80%, rgba(255,255,255,0.5), transparent),
                radial-gradient(3px 3px at 70% 90%, rgba(255,255,255,0.4), transparent),
                radial-gradient(2px 2px at 30% 50%, rgba(255,255,255,0.4), transparent),
                radial-gradient(2px 2px at 90% 30%, rgba(255,255,255,0.3), transparent),
                radial-gradient(3px 3px at 50% 10%, rgba(255,255,255,0.3), transparent),
                radial-gradient(2px 2px at 15% 60%, rgba(255,255,255,0.4), transparent),
                radial-gradient(3px 3px at 75% 40%, rgba(255,255,255,0.3), transparent),
                radial-gradient(2px 2px at 45% 90%, rgba(255,255,255,0.4), transparent);
            animation: sparkleTwinkle 2.5s ease-in-out infinite;
        }
        
        @keyframes sparkleTwinkle {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 0.7; }
        }
        
        /* WHITE Sparkle particles - Mouse trail */
        .sparkle-particle {
            position: fixed;
            pointer-events: none;
            z-index: 99999;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(255,255,255,0.8) 40%, transparent 70%);
            animation: particleFade 0.8s ease-out forwards;
            box-shadow: 
                0 0 6px 2px rgba(255,255,255,0.8),
                0 0 12px 4px rgba(255,255,255,0.4);
            will-change: transform, opacity;
        }
        
        @keyframes particleFade {
            0% { transform: scale(0) rotate(0deg); opacity: 1; }
            50% { transform: scale(1.5) rotate(180deg); opacity: 0.8; }
            100% { transform: scale(0) rotate(360deg); opacity: 0; }
        }
        
        .sparkle-star {
            position: fixed;
            pointer-events: none;
            z-index: 99998;
            width: 4px;
            height: 4px;
            animation: starFade 0.9s ease-out forwards;
            will-change: transform, opacity;
        }
        
        .sparkle-star::before,
        .sparkle-star::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 4px 1px rgba(255,255,255,0.9);
        }
        
        .sparkle-star::before { width: 10px; height: 2px; }
        .sparkle-star::after { width: 2px; height: 10px; }
        
        @keyframes starFade {
            0% { transform: scale(0) rotate(0deg); opacity: 1; }
            100% { transform: scale(2) rotate(90deg); opacity: 0; }
        }
        
        .sparkle-diamond {
            position: fixed;
            pointer-events: none;
            z-index: 99997;
            width: 6px;
            height: 6px;
            background: white;
            transform: rotate(45deg);
            animation: diamondFade 0.7s ease-out forwards;
            box-shadow: 0 0 8px 2px rgba(255,255,255,0.7);
            will-change: transform, opacity;
        }
        
        @keyframes diamondFade {
            0% { transform: rotate(45deg) scale(0); opacity: 1; }
            100% { transform: rotate(135deg) scale(2); opacity: 0; }
        }
        
        .background-video { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: -1; 
        }
        .background-video video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            filter: brightness(0.25);
        }
        .background-video::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, 
                rgba(10, 10, 10, 0.85) 0%,
                rgba(240, 128, 128, 0.15) 50%,
                rgba(10, 10, 10, 0.85) 100%);
            animation: glowPulse 8s ease-in-out infinite;

        @keyframes glowPulse {

        // ============================================================
        // WHITE SPARKLE PARTICLE SYSTEM

        const SparkleSystem = {
            enabled: true,
            lastSparkleTime: 0,
            sparkleInterval: 100,
            
            init() {
                document.addEventListener('mousemove', (e) => this.onMouseMove(e));
                document.addEventListener('touchmove', (e) => this.onTouchMove(e), { passive: true });
                document.addEventListener('visibilitychange', () => {
                    this.enabled = !document.hidden;
                });
            },
            
            onMouseMove(e) {
                if (!this.enabled || document.hidden) return;
                const now = performance.now();
                if (now - this.lastSparkleTime < this.sparkleInterval) return;
                this.lastSparkleTime = now;
                this.createSparkle(e.clientX, e.clientY);
            },
            
            onTouchMove(e) {
                if (!this.enabled) return;
                const now = performance.now();
                if (now - this.lastSparkleTime < this.sparkleInterval * 2) return;
                this.lastSparkleTime = now;
                const touch = e.touches[0];
                this.createSparkle(touch.clientX, touch.clientY);
            },
            
            createSparkle(x, y) {
                const type = Math.random();
                if (type < 0.4) this.createParticle(x, y);
                else if (type < 0.7) this.createStar(x, y);
                else this.createDiamond(x, y);
            },
            
            createParticle(x, y) {
                const particle = document.createElement('div');
                particle.className = 'sparkle-particle';
                const size = 3 + Math.random() * 5;
                const offsetX = (Math.random() - 0.5) * 30;
                const offsetY = (Math.random() - 0.5) * 30;
                particle.style.left = (x + offsetX) + 'px';
                particle.style.top = (y + offsetY) + 'px';
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                document.body.appendChild(particle);
                setTimeout(() => { if (particle.parentNode) particle.remove(); }, 800);
            },
            
            createStar(x, y) {
                const star = document.createElement('div');
                star.className = 'sparkle-star';
                const size = 4 + Math.random() * 6;
                const offsetX = (Math.random() - 0.5) * 25;
                const offsetY = (Math.random() - 0.5) * 25;
                star.style.left = (x + offsetX) + 'px';
                star.style.top = (y + offsetY) + 'px';
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                document.body.appendChild(star);
                setTimeout(() => { if (star.parentNode) star.remove(); }, 900);
            },
            
            createDiamond(x, y) {
                const diamond = document.createElement('div');
                diamond.className = 'sparkle-diamond';
                const size = 4 + Math.random() * 4;
                const offsetX = (Math.random() - 0.5) * 20;
                const offsetY = (Math.random() - 0.5) * 20;
                diamond.style.left = (x + offsetX) + 'px';
                diamond.style.top = (y + offsetY) + 'px';
                diamond.style.width = size + 'px';
                diamond.style.height = size + 'px';
                document.body.appendChild(diamond);
                setTimeout(() => { if (diamond.parentNode) diamond.remove(); }, 700);
            }
        };

        function createCard(game, isFeatured = false) {
            const mediaHTML = game.video ? `
                <div class="game-media">
                    <video src="${game.video}" muted loop 
                           onmouseover="this.play()" 
                           onmouseout="this.pause(); this.currentTime=0;">
                    </video>
                    <div class="play-indicator">▶</div>
                </div>
            ` : `
                <div class="game-media">
                    <img src="${game.img}" alt="${game.title}" loading="lazy">
                </div>
            `;
            
            return `
                <div class="${isFeatured ? 'featured-card' : 'project-card'}">
                    ${mediaHTML}
                    <div class="${isFeatured ? 'featured-content' : 'project-content'}">
                        <h3>${game.title}</h3>
                        <p>${game.desc}</p>
                        <div class="project-tags">${game.tags.map(t => `<span class="project-tag">${t}</span>`).join('')}</div>
                        ${game.platforms ? `<div class="platform-badges">${game.platforms.map(p => `<span class="platform-badge">${p}</span>`).join('')}</div>` : ''}
                        ${game.links && Object.keys(game.links).length > 0 ? `
                            <div class="game-links">
                                ${Object.entries(game.links).map(([name, url]) => 
                                    `<a href="${url}" target="_blank" class="game-link" onclick="event.stopPropagation()">${name}</a>`
                                ).join('')}
                            </div>
                        ` : ''}
                    </div>
                </div>`;
        }

        document.getElementById('featured-grid').innerHTML = gameData.featured.map(g => createCard(g, true)).join('');
        document.getElementById('released-games').innerHTML = gameData.released.map(g => createCard(g)).join('');
        document.getElementById('upcoming-projects').innerHTML = gameData.upcoming.map(g => createCard(g)).join('');
    </script>
</body>
</html>
